name: Black Friday CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit and architecture tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-dev.lock

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock

      - name: Lint (flake8, black, isort on clean paths)
        run: make lint-ci

      # tests/integration and tests/e2e need the live stack (PostgreSQL, Redis, MLflow, the API and the LLM),
      # so they run locally with `make test-integration` and `make test-e2e`, not on every push.
      - name: Unit tests
        env:
          PYTHONPATH: .
        run: python -m pytest tests/unit tests/load -v --timeout=60

      - name: Architecture tests
        env:
          PYTHONPATH: .
        run: python -m pytest tests/architecture -v --timeout=60
